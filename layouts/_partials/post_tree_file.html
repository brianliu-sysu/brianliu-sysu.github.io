{{- $page := .page -}}
{{- $last := .last -}}
<article class="post-entry">
  <a class="tn-file-link" href="{{ $page.RelPermalink }}" aria-label="{{ $page.Title | plainify }}">
    <div class="tn-file-row">
      <span class="tn-connector" aria-hidden="true">{{ if $last }}└─{{ else }}├─{{ end }}</span>
      <span class="tn-file-icon" aria-hidden="true"></span>
      <h2 class="tn-file-name">{{ $page.Title }}{{ if $page.Draft }} <span class="entry-isdraft">[draft]</span>{{ end }}<span class="tn-ext">.md</span></h2>
      <span class="tn-file-date">{{ $page.Date.Format "2006-01-02" }}</span>
    </div>
    {{- with $page.Description }}
    <div class="tn-file-desc">{{ . | plainify | htmlUnescape }}</div>
    {{- end }}
  </a>
</article>
